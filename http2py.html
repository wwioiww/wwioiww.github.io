<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTTP 请求转 Python3 httpx</title>
  <style>
    :root {
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-color: #f3f4f6;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-sub: #6b7280;
      --border-color: #e5e7eb;
      --code-bg: #1e1e1e;
      --code-text: #d4d4d4;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 900px;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }

    h2 {
      margin-top: 0;
      color: var(--text-main);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 15px;
      margin-bottom: 20px;
      font-size: 1.5rem;
    }

    h3 {
      font-size: 1.1rem;
      margin-top: 25px;
      margin-bottom: 10px;
      color: var(--text-main);
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      font-size: 0.9rem;
      color: var(--text-main);
    }

    .input-group {
      margin-bottom: 15px;
    }

    textarea, input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
      font-size: 0.9rem;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: #f9fafb;
    }

    textarea:focus, input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
      background: #fff;
    }

    textarea {
      height: 200px;
      resize: vertical;
    }

    /* Grid layout for settings */
    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
      background: #f8fafc;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    @media (max-width: 600px) {
      .settings-grid { grid-template-columns: 1fr; }
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 20px;
    }

    button {
      cursor: pointer;
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    /* Primary Button */
    button.primary {
      background-color: var(--primary-color);
      color: white;
    }
    button.primary:hover {
      background-color: var(--primary-hover);
      box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
    }

    /* Secondary Buttons */
    button.secondary {
      background-color: white;
      border: 1px solid var(--border-color);
      color: var(--text-main);
    }
    button.secondary:hover {
      background-color: #f3f4f6;
      border-color: #d1d5db;
    }

    button.ghost {
      background: transparent;
      color: var(--text-sub);
      text-decoration: underline;
      padding: 10px 5px;
      font-weight: normal;
    }
    button.ghost:hover {
      color: var(--primary-color);
    }

    pre {
      background: var(--code-bg);
      color: var(--code-text);
      padding: 15px;
      border-radius: 8px;
      overflow-x: auto;
      font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
      font-size: 0.9rem;
      line-height: 1.5;
      min-height: 100px;
      position: relative;
    }
    
    /* Scrollbar styling for code block */
    pre::-webkit-scrollbar { height: 8px; }
    pre::-webkit-scrollbar-track { background: #2d2d2d; }
    pre::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }

  </style>
</head>
<body>

<div class="container">
  <h2>HTTP 请求转 Python3 httpx</h2>

  <div class="input-group">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <label for="httpInput">HTTP 请求原文</label>
      <button onclick="insertSample()" class="ghost" style="font-size: 0.85rem;">粘贴示例</button>
    </div>
    <textarea id="httpInput" placeholder="POST /api/v1/login HTTP/1.1
Host: example.com
..."></textarea>
  </div>

  <div class="settings-grid">
    <div class="input-group">
      <label for="proxyInput">代理地址（可选）</label>
      <input type="text" id="proxyInput" placeholder="http://127.0.0.1:8080" value="http://127.0.0.1:8080">
    </div>

    <div class="input-group">
      <label for="excludeHeaders">排除 Headers（逗号分隔）</label>
      <input type="text" id="excludeHeaders" placeholder="User-Agent,Cookie">
    </div>

    <div class="input-group" style="grid-column: span 2;">
      <label for="filenameInput">导出文件名（可选，无需后缀）</label>
      <input type="text" id="filenameInput" placeholder="converted_request">
    </div>
  </div>

  <div class="btn-group">
    <button onclick="convert()" class="primary">⚡ 转换为 Python3 httpx</button>
    <button onclick="copyCode()" class="secondary">📋 复制代码</button>
    <button onclick="download()" class="secondary">💾 导出 .py 文件</button>
  </div>

  <h3>生成的 Python3 代码：</h3>
  <pre id="output"># 点击“转换为 Python3 httpx”按钮生成代码...</pre>
</div>

<script>
  let lastResult = "";
  let lastResultFilename = ""; // Added to store filename context

  function convert() {
    const input = document.getElementById('httpInput').value.trim();
    const proxy = document.getElementById('proxyInput').value.trim();
    const filename = document.getElementById('filenameInput').value.trim() || "converted_request";
    const excludeList = document.getElementById('excludeHeaders').value
      .split(',').map(s => s.trim().toLowerCase()).filter(Boolean);

    const lines = input.split('\n');
    if (!lines.length) {
        alert("请先输入 HTTP 请求内容");
        return;
    }

    const [method, path] = lines[0].split(' ');
    let url = '';
    const headers = {};
    let cookies = '';
    let body = '';
    let inBody = false;

    for (let i = 1; i < lines.length; i++) {
      const line = lines[i];
      if (line === '') {
        inBody = true;
        continue;
      }
      if (inBody) {
        body += line + '\n';
        continue;
      }
      if (line.toLowerCase().startsWith('host:')) {
        const host = line.split(':')[1].trim();
        const protocol = input.toLowerCase().includes('https') ? 'https://' : 'http://';
        url = protocol + host + path;
      } else if (line.toLowerCase().startsWith('cookie:')) {
        cookies = line.slice(7).trim();
      } else if (line.includes(':')) {
        const idx = line.indexOf(':');
        const key = line.slice(0, idx).trim();
        const val = line.slice(idx + 1).trim();
        if (!excludeList.includes(key.toLowerCase())) {
          headers[key] = val;
        }
      }
    }

    const headersStr = Object.entries(headers).map(
      ([k, v]) => `    '${k}': '${v}'`
    ).join(',\n');

    const cookiesStr = cookies && !excludeList.includes('cookie') ?
      `cookies = {${cookies.split('; ').map(kv => {
        const [k, v] = kv.split('=');
        return `'${k}': '${v}'`;
      }).join(', ')}}` : '';

    let bodyBlock = '';
    let bodyParam = '';
    const contentTypeHeader = Object.keys(headers).find(h => h.toLowerCase() === 'content-type');
    const contentTypeVal = contentTypeHeader ? headers[contentTypeHeader] : '';

    if (method.toUpperCase() === 'POST' && body.trim()) {
      if (contentTypeVal.includes('application/json')) {
        try {
          const jsonObj = JSON.parse(body.trim());
          bodyBlock = 'json_data = ' + JSON.stringify(jsonObj, null, 4) + '\n';
          bodyParam = 'json=json_data';
        } catch {
          bodyBlock = `# ⚠️ JSON 解析失败，请手动检查\njson_data = """${body.trim()}"""\n`;
          bodyParam = 'json=json_data';
        }
      } else if (contentTypeVal.includes('application/x-www-form-urlencoded')) {
        bodyBlock = `data = '''${body.trim()}'''\n`;
        bodyParam = 'data=data';
      } else if (contentTypeVal.includes('multipart/form-data')) {
        const boundaryMatch = contentTypeVal.match(/boundary=([^;]+)/);
        const boundary = boundaryMatch ? boundaryMatch[1] : '----WebKitFormBoundary';
        bodyBlock = `# ⚠️ multipart/form-data 内容建议使用 files={} 和 data={} 手动填充\n` +
                    `multipart_body = """${body.trim()}"""\n`;
        bodyParam = 'data=multipart_body';
      } else {
        bodyBlock = `data = """${body.trim()}"""\n`;
        bodyParam = 'data=data';
      }
    }

    const args = ['url'];
    if (headersStr) args.push('headers=headers');
    if (cookiesStr) args.push('cookies=cookies');
    if (bodyParam) args.push(bodyParam);
    if (proxy) args.push('proxies=proxies');
    args.push('verify=False');

    const result = `import httpx

url = "${url}"
${headersStr ? `headers = {\n${headersStr}\n}` : ''}
${cookiesStr}
proxies={"http://": "${proxy}", "https://": "${proxy}"}
${bodyBlock}rsp = httpx.${method.toLowerCase()}(${args.join(', ')})
`;

    document.getElementById('output').textContent = result;
    lastResult = result;
    lastResultFilename = filename;
  }

  function copyCode() {
    if (!lastResult) {
      alert("请先生成代码");
      return;
    }
    navigator.clipboard.writeText(lastResult).then(() => {
      alert("代码已复制到剪贴板");
    });
  }

  function download() {
    if (!lastResult) {
      alert("请先生成 Python 代码");
      return;
    }
    const filename = (document.getElementById('filenameInput').value.trim() || "converted_request") + ".py";
    const blob = new Blob([lastResult], { type: 'text/x-python' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
  }

  function insertSample() {
    const sample = `POST /upload HTTP/1.1
Host: example.com
User-Agent: Mozilla/5.0
Content-Type: multipart/form-data; boundary=----WebKitFormBoundary123456789
Cookie: session=abcdef123456

------WebKitFormBoundary123456789
Content-Disposition: form-data; name="file"; filename="test.txt"
Content-Type: text/plain

hello world
------WebKitFormBoundary123456789--`;
    document.getElementById('httpInput').value = sample;
  }
</script>
</body>
</html>
