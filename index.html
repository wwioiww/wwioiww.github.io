<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Toolbox</title>
    <!-- 引入图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引入谷歌字体 -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #e2e8f0;
            --accent-color: #38bdf8;
            --hover-color: #0ea5e9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'JetBrains Mono', monospace; /* 使用代码风格字体 */
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 100%);
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-color);
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-color);
            box-shadow: 0 10px 20px -5px rgba(56, 189, 248, 0.2);
        }

        .card i {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: var(--accent-color);
            transition: transform 0.3s ease;
        }

        .card:hover i {
            transform: scale(1.1);
        }

        .card span {
            font-weight: 700;
            font-size: 1.1rem;
        }

        /* 底部装饰 */
        footer {
            text-align: center;
            margin-top: 40px;
            font-size: 0.8rem;
            color: #475569;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Sec Tools</h1>
            <p class="subtitle">Daily Operations & Utilities</p>
        </header>

        <div class="grid">
            <!-- 卡片 1 -->
            <a href="https://tools.hainansec.com/cyber" class="card" target="_blank">
                <i class="fa-solid fa-key"></i>
                <span>加解密</span>
            </a>

            <!-- 卡片 2 -->
            <a href="https://gchq.github.io/CyberChef/" class="card" target="_blank">
                <i class="fa-solid fa-user-secret"></i>
                <span>CyberChef</span>
            </a>

            <!-- 卡片 3 -->
            <a href="https://av.aabyss.cn/" class="card" target="_blank">
                <i class="fa-solid fa-shield-virus"></i>
                <span>杀软识别</span>
            </a>

            <!-- 卡片 4 -->
            <a href="https://ping.chinaz.com/" class="card" target="_blank">
                <i class="fa-solid fa-network-wired"></i>
                <span>多地 PING</span>
            </a>

            <!-- 卡片 5 -->
            <a href="https://tools.hainansec.com/http2py3.html" class="card" target="_blank">
                <i class="fa-brands fa-python"></i>
                <span>HTTP 转 Py3</span>
            </a>

            <!-- 卡片 6 -->
            <a href="https://cli.im/deqr" class="card" target="_blank">
                <i class="fa-solid fa-qrcode"></i>
                <span>二维码转网址</span>
            </a>
        </div>

        <footer>
            <p>Hosted on GitHub Pages</p>
        </footer>
    </div>

</body>
</html>
