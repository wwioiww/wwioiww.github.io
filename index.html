<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sec_Dashboard // Tools</title>
    <!-- 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 字体 -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #111;
            --text-color: #0f0; /* 经典的黑客绿，或者你可以改成之前的蓝色 #38bdf8 */
            --text-dim: #005500;
            --accent-color: #00ff00;
            --border-color: #333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* CRT 扫描线背景特效 */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 900px;
            z-index: 3; /* 位于特效之上 */
        }

        /* 顶部状态栏 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-bottom: 40px;
            border-bottom: 1px solid var(--text-dim);
            padding-bottom: 5px;
        }

        /* 标题区域 */
        header { text-align: center; margin-bottom: 30px; }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        /* 打字机光标 */
        .cursor {
            display: inline-block;
            width: 10px;
            background-color: var(--accent-color);
            animation: blink 1s infinite;
        }

        /* 搜索框 */
        .search-wrapper {
            margin-bottom: 30px;
            position: relative;
        }
        
        .search-input {
            width: 100%;
            padding: 15px 20px;
            padding-left: 45px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--text-dim);
            color: var(--accent-color);
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            border-radius: 4px;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
        }

        /* 网格布局 */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: rgba(20, 20, 20, 0.8);
            padding: 20px;
            border: 1px solid var(--border-color);
            text-decoration: none;
            color: #bbb;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            border-color: var(--accent-color);
            background-color: rgba(0, 50, 0, 0.2);
            color: var(--accent-color);
            transform: translateY(-2px);
        }

        .card i {
            font-size: 1.8rem;
            margin-bottom: 15px;
            color: var(--text-dim);
            transition: color 0.3s;
        }

        .card:hover i { color: var(--accent-color); }

        .card h3 {
            font-size: 1.1rem;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .card p {
            font-size: 0.8rem;
            color: #666;
        }

        /* 右上角装饰 */
        .card::after {
            content: "";
            position: absolute;
            top: 0; right: 0;
            width: 0; height: 0;
            border-style: solid;
            border-width: 0 30px 30px 0;
            border-color: transparent var(--text-dim) transparent transparent;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .card:hover::after { opacity: 0.5; }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        footer {
            margin-top: auto;
            padding-top: 40px;
            font-size: 0.7rem;
            color: #444;
            text-align: center;
        }
        
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <!-- 顶部信息栏 -->
        <div class="status-bar">
            <span id="user-ip">Detecting IP...</span>
            <span id="clock">00:00:00</span>
        </div>

        <header>
            <!-- 打字机效果标题 -->
            <h1><span id="typewriter"></span><span class="cursor">&nbsp;</span></h1>
        </header>

        <!-- 搜索框 -->
        <div class="search-wrapper">
            <i class="fa-solid fa-terminal search-icon"></i>
            <input type="text" id="searchInput" class="search-input" placeholder="Type to search tools... (Press '/')">
        </div>

        <!-- 工具列表 -->
        <div class="grid" id="toolGrid">
            
            <a href="https://tools.hainansec.com/cyber" class="card" target="_blank">
                <i class="fa-solid fa-key"></i>
                <h3>Crypto</h3>
                <p>HainanSec 加解密工具</p>
            </a>

            <a href="https://gchq.github.io/CyberChef/" class="card" target="_blank">
                <i class="fa-solid fa-utensils"></i>
                <h3>CyberChef</h3>
                <p>英国 GCHQ 官方瑞士军刀</p>
            </a>

            <a href="https://av.aabyss.cn/" class="card" target="_blank">
                <i class="fa-solid fa-shield-virus"></i>
                <h3>AV Check</h3>
                <p>杀软进程识别 / 免杀辅助</p>
            </a>

            <a href="https://ping.chinaz.com/" class="card" target="_blank">
                <i class="fa-solid fa-network-wired"></i>
                <h3>Multi Ping</h3>
                <p>站长之家全国多地测速</p>
            </a>

            <a href="https://tools.hainansec.com/http2py3.html" class="card" target="_blank">
                <i class="fa-brands fa-python"></i>
                <h3>HTTP -> Py3</h3>
                <p>Raw Request 转 Python 代码</p>
            </a>

            <!-- 示例：可以方便地添加更多 -->
            <!--
            <a href="#" class="card">
                <i class="fa-solid fa-plus"></i>
                <h3>New Tool</h3>
                <p>Description</p>
            </a>
            -->
        </div>

        <footer>
            <p>SYSTEM READY // ACCESS GRANTED</p>
        </footer>
    </div>

    <script>
        // 1. 打字机效果
        const text = "Welcome to Toolbox_";
        const speed = 100;
        let i = 0;
        
        function typeWriter() {
            if (i < text.length) {
                document.getElementById("typewriter").innerHTML += text.charAt(i);
                i++;
                setTimeout(typeWriter, speed);
            }
        }
        window.onload = typeWriter;

        // 2. 实时时钟
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('en-GB');
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 3. 获取用户IP (使用 ipify API)
        fetch('https://api.ipify.org?format=json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('user-ip').innerText = `CLIENT_IP: ${data.ip}`;
            })
            .catch(err => {
                document.getElementById('user-ip').innerText = `CLIENT_IP: UNKNOWN`;
            });

        // 4. 搜索功能
        const searchInput = document.getElementById('searchInput');
        const cards = document.querySelectorAll('.card');

        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            cards.forEach(card => {
                const title = card.querySelector('h3').innerText.toLowerCase();
                const desc = card.querySelector('p').innerText.toLowerCase();
                if (title.includes(term) || desc.includes(term)) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            });
        });

        // 5. 快捷键 '/' 聚焦搜索框
        document.addEventListener('keydown', (e) => {
            if (e.key === '/' && document.activeElement !== searchInput) {
                e.preventDefault();
                searchInput.focus();
            }
        });
    </script>
</body>
</html>
